services:
  clipbox:
    build: .
    image: clipbox:latest
    container_name: clipbox
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # 只暴露给本机反代，不直接暴露公网
    environment:
      - PORT=3000
      # 管理接口令牌：部署前务必换成 openssl rand -hex 32 生成的随机值
      - ADMIN_TOKEN=${ADMIN_TOKEN:?请在 .env 中设置 ADMIN_TOKEN}
      # 经过 caddy 反代，信任 X-Forwarded-For 以获得真实客户端 IP（限流/配额依赖）
      - TRUST_PROXY=1
    volumes:
      - clipbox-data:/app/data   # SQLite 数据持久化

  # 反向代理：自动 HTTPS（把 clip.example.com 换成你的域名）
  caddy:
    image: caddy:2-alpine
    container_name: clipbox-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - clipbox

volumes:
  clipbox-data:
  caddy-data:
  caddy-config:
